name: Deploy static site to GitHub Pages

on:
  push:
    branches: [main]
    paths-ignore:
      - "logs/site-stats.json"
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    permissions:
      contents: write
      pages: write
      id-token: write
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Update aggregate view log
        env:
          GOATCOUNTER_CODE: ${{ vars.GOATCOUNTER_CODE }}
          GOATCOUNTER_API_TOKEN: ${{ secrets.GOATCOUNTER_API_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "$GOATCOUNTER_CODE" ] && [ -z "$GOATCOUNTER_API_TOKEN" ]; then
            echo "::warning::GoatCounter is not configured. Add the GOATCOUNTER_CODE Actions variable and GOATCOUNTER_API_TOKEN Actions secret, then run this workflow again."
          elif [ -z "$GOATCOUNTER_CODE" ] || [ -z "$GOATCOUNTER_API_TOKEN" ]; then
            echo "::error::Both GOATCOUNTER_CODE and GOATCOUNTER_API_TOKEN must be configured."
            exit 1
          else
            python logs/update_stats.py
          fi

      - name: Commit updated aggregate log
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add logs/site-stats.json
          if ! git diff --cached --quiet; then
            git commit -m "Update aggregated site statistics"
            git push
          fi

      - name: Build static site
        run: |
          set -euo pipefail
          mkdir _site
          cp index.html script.js login-demo.js styles.css justflex.wat _site/
          cp -R crypto _site/
          mkdir -p _site/logs
          cp logs/site-stats.json _site/logs/

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
